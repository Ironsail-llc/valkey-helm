{{- if and .Values.podDisruptionBudget.enabled .Values.replica.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "valkey.fullname" . }}
  labels:
    {{- include "valkey.labels" . | nindent 4 }}
spec:
  {{- if .Values.podDisruptionBudget.minAvailable }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- else if .Values.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "valkey.selectorLabels" . | nindent 6 }}
    {{- if .Values.haproxy.enabled }}
    {{- /* The HAProxy pods carry the same name/instance labels, so without
         this the PDB covers them too and its minAvailable is satisfied by
         HAProxy while every StatefulSet pod is drained. */}}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: NotIn
        values: ["haproxy"]
    {{- end }}
  {{- with .Values.podDisruptionBudget.unhealthyPodEvictionPolicy }}
  unhealthyPodEvictionPolicy: {{ . }}
  {{- end }}
{{- end }}
